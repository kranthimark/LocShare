   name: Build APK

   on:
     push:
     workflow_dispatch:

   jobs:
     build:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4

         - uses: actions/setup-java@v4
           with:
             distribution: temurin
             java-version: '17'

         - uses: android-actions/setup-android@v3

         - name: Build debug APK
           run: |
             cd "$(dirname "$(find . -name gradlew -not -path '*/node_modules/*' | head -1)")"
             chmod +x gradlew
             ./gradlew assembleDebug --no-daemon
             cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/LocShare.apk"

         - uses: actions/upload-artifact@v4
           with:
             name: LocShare-apk
             path: LocShare.apk
